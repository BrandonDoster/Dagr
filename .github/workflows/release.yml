# Pushing a version tag (v1.2.3) builds the APK unprivileged, then a separate job signs it and publishes a
# GitHub release with a SHA-256 checksum (and a build provenance attestation while the repo is public).
#
# Secrets on the "release" environment (restrict that environment to v* tags in repo settings):
#   DAGR_KEYSTORE_B64       base64 of the PKCS12 release keystore
#   DAGR_KEYSTORE_PASSWORD  its password (store and key share it)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # Gradle and its plugins run here, with no secrets and no write permissions.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version from tag
        id: version
        run: |
          # versionCode must never go down: Android refuses it, and the only way out is uninstall (all alarms lost).
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH with minor and patch below 100"; exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Test and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew testDebugUnitTest assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  release:
    # Signs and publishes. No checkout, no Gradle: nothing from the repo runs next to the secrets.
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk

      - name: Install build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "build-tools;37.0.0" > /dev/null

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.DAGR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAGR_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing"; exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          mkdir -p dist
          APK="dist/dagr-$VERSION.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD \
            --out "$APK" app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          cd dist && sha256sum dagr-*.apk > SHA256SUMS

      # Attestations need a public repo (or GitHub Enterprise for private ones).
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dagr-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/dagr-*.apk dist/SHA256SUMS --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
